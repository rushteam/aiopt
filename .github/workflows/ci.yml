# The pull-request gate: run the same checks AGENTS.md requires before a commit, so
# "CI is the final authority" is actually true rather than an honour system.
#
# Trigger: every pull request, plus pushes to main (so the trunk is verified even for
# the maintainer's direct-push exception). `release.yml` is a separate concern — it
# only packages installers on a version tag and does not gate anything.
#
# One Linux job, not a three-OS matrix. Be precise about what that does and does not
# buy, because an earlier version of this comment claimed the suite was
# "platform-independent" and it was not — providers/ and skills/ asserted POSIX paths
# and POSIX file modes, which no Linux-only run could ever notice. That surfaced as a
# release bug: release.yml runs this same gate BEFORE `electron-forge make`, so the
# windows-latest leg died at the tests and produced no installer while mac and linux
# published normally.
#
# What is true now: the platform is an INJECTED value wherever the behaviour under test
# is path- or platform-shaped — `path.win32` into main/displayPath.ts, `platform` into
# app-shortcuts, see main/__tests__/displayPath.test.ts — so Windows semantics are
# asserted here, on Linux, and regress loudly. What remains host-dependent is narrower
# and branches explicitly rather than assuming POSIX: a 0600 assertion (Windows cannot
# enforce the bits) and a symlink-fixture probe (Windows needs elevation to create one).
# Those two are weaker on a non-POSIX host, so the suite is platform-PORTABLE, not
# platform-independent.
#
# Adding a windows-latest leg here is the only thing that closes that last gap. It is
# not enabled because it roughly doubles PR wall-clock for two assertions; release.yml's
# matrix does run the full gate on all three platforms at tag time, which is the
# backstop. Revisit if anything platform-shaped lands in main/ again.
#
# Reads the repository and the pull-request event payload only — no secrets, no
# network beyond the package registry, nothing published.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run on the same ref; the trunk is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the DCO check resolves merge-base(base, head) to see exactly
          # the commits this PR introduces, which a shallow clone cannot do.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # The Node the BUILD runs on (engines: >=20) — unrelated to the Node 24
          # runtime the actions themselves now use.
          node-version: 20
          # Explicit, so setup-node v6's "automatic caching is npm-only" change
          # cannot silently drop the pnpm store cache.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The hard gate from AGENTS.md: all unit tests, every workspace.
      - name: Unit test gate
        run: pnpm test:unit

      # Every workspace that declares a typecheck script, not just desktop.
      - name: Typecheck
        run: pnpm -r run --if-present typecheck

      - name: i18n glossary gate
        run: pnpm check:i18n-glossary

      # Keeps the two manifests from drifting apart while nobody is releasing. No tag is in
      # scope on a PR or a push to main, so this is the manifests-agree half of the gate;
      # release.yml runs the same script with the tag.
      - name: Version consistency
        run: pnpm check:version

      # The local self-check mirroring the DCO App. Pull requests only: the script
      # derives its range from the pull_request payload, and a push to main has no
      # such payload (its commits were already checked on the PR that introduced them).
      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        run: pnpm check:dco
