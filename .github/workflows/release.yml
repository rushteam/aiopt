# Build the desktop app on all three platforms and publish the installers to a
# GitHub Release.
#
# Trigger: pushing a version tag (v*), or a manual run (workflow_dispatch) for a
# dry build that uploads artifacts to the run without creating a Release.
#
# This is a DOWNLOAD channel only — it packages and publishes installers for
# people to fetch by hand. It is NOT an auto-update feed: the app's in-product
# "check for updates" is a separate, gated change (see docs/dev-rules/updater.md)
# and nothing here wires one up.
#
# No code signing is configured yet. Unsigned builds still run, but macOS
# Gatekeeper / Windows SmartScreen will warn on first launch. Signing is a
# follow-up; when added it plugs into the `package`/`make` step via secrets.
#
# The Homebrew cask (packaging/homebrew/aiopt.rb, published in rushteam/homebrew-tap)
# downloads the macOS dmg from the Release. The tap's own workflow picks up a newly
# published Release and bumps the cask — see docs/dev-rules/development-workflow.md §6.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # The Node the BUILD runs on (engines: >=20) — unrelated to the Node 24
          # runtime the actions themselves now use.
          node-version: 20
          # Explicit, so setup-node v6's "automatic caching is npm-only" change
          # cannot silently drop the pnpm store cache.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail before building rather than after publishing: Electron stamps the installer
      # names and `app.getVersion()` from the packaged package.json, never from the tag, so
      # a tag that disagrees with the manifests ships a Release whose assets and About page
      # state a different version than its name. GITHUB_REF supplies the tag.
      - name: Version matches the tag
        run: pnpm check:version

      # CI is the final authority on the test gate (AGENTS.md). No installers are
      # built unless every workspace's unit tests pass.
      - name: Unit test gate
        run: pnpm test:unit

      - name: Typecheck (desktop)
        run: pnpm --filter desktop run --if-present typecheck

      # `electron-forge make` builds for the host platform, so each matrix OS
      # produces its own installers. No signing: disable macOS identity
      # auto-discovery so an unsigned build doesn't fail looking for a cert.
      - name: Package installers
        run: pnpm --filter desktop run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Read the fuses back from the packaged binary. A config that silently skips
      # FusesPlugin still builds cleanly, which is how v1.0.0 shipped unhardened.
      - name: Fuses are flipped
        run: pnpm --filter desktop run check:fuses

      - name: Upload build artifacts to the run
        uses: actions/upload-artifact@v7
        with:
          name: aiopt-${{ matrix.name }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14

      # Only on a version tag: attach the installers to the GitHub Release.
      # softprops/action-gh-release creates the Release on first run and appends
      # assets from each matrix job to the same tag.
      #
      # `body` goes above the generated notes. It must be set: when a later matrix job
      # updates the Release, the action keeps the existing body and appends freshly
      # generated notes to it, so without `body` the notes appear once per platform.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/desktop/out/make/**/*
          fail_on_unmatched_files: true
          draft: true # review the assets, then publish the Release manually
          generate_release_notes: true
          body: |
            ## Install

            **macOS (Apple Silicon)** — install with Homebrew, no Gatekeeper prompt:

            ```sh
            brew install --cask rushteam/tap/aiopt
            ```

            Or download `AiOpt-*-arm64.dmg` below, open it and drag **AiOpt.app** onto the **Applications** folder.

            **如果提示已损坏，请在终端执行 `sudo xattr -cr /Applications/AiOpt.app`**

            **If macOS says the app is damaged, run `sudo xattr -cr /Applications/AiOpt.app` in Terminal.**

            **Windows** — run `AiOpt-*.Setup.exe`; if SmartScreen warns, choose More info → Run anyway.

            **Linux** — unzip `AiOpt-linux-x64-*.zip` and run `AiOpt`.

            These builds are not code-signed yet. Only install them from this page.
