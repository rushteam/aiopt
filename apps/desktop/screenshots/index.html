<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AiOpt screenshot harness</title>
    <style>
      /* The window's macOS traffic lights, drawn in place of the native ones the hidden
         title bar leaves room for (mainWindow.ts trafficLightPosition). */
      .traffic-lights { position: fixed; top: 14px; left: 14px; display: flex; gap: 8px; z-index: 1; }
      .traffic-lights span { width: 12px; height: 12px; border-radius: 50%; }
    </style>
  </head>
  <body>
    <div class="traffic-lights" aria-hidden="true">
      <span style="background: #ff5f57"></span>
      <span style="background: #febc2e"></span>
      <span style="background: #28c840"></span>
    </div>
    <div id="root"></div>
    <!-- Module scripts run in order: the mock bridge is in place before the app reads it. -->
    <script type="module" src="./mockBridge.ts"></script>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
